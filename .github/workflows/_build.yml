name: Build (reusable)

# Single source of truth for the TDShop site pipeline. Called by ci.yml
# (PR gate, no publish), dev.yml (demo build → dev branch) and release.yml
# (production build → release branch + deploy ping). Behaviour selected through
# the inputs. See AGENTS.md for the --no-package-lock / NPM_TOKEN rationale.

on:
  workflow_call:
    inputs:
      demo_mode:
        description: Value for PUBLIC_DEMO_MODE on publishing builds (dev=true, release=false).
        type: boolean
        default: false
      publish_branch:
        description: Orphan branch to force-publish dist/ to (dev | release). Empty = no publish.
        type: string
        default: ''
      deploy:
        description: Ping the deploy webhook after publishing (release only).
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@tracht-digital-solutions'

      - name: Pin npm
        # Node 22 ships npm 10, whose arborist crashes with
        # "Cannot read properties of null (reading 'edgesOut')" on some
        # dependency graphs — it killed tds-ext-shop-pkg's very first release,
        # at Install, before a single test ran.
        #
        # It bites here and not everywhere because `--no-package-lock` below
        # makes every run re-resolve the tree from scratch, so the npm doing the
        # resolving has to be current. The journal and the landing page carry
        # the same step; this workflow was seeded from the tools site, which
        # does not, and inherited the gap.
        run: npm install -g npm@11

      - name: Install
        # Windows-generated lockfile is win32-only; --no-package-lock resolves
        # the right native binaries on the Linux runner (npm/cli#4828).
        run: npm install --no-package-lock
        env:
          NPM_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      - name: Type check
        run: npm run type-check

      - name: Lint primitives
        # This site renders the `blog` surface, so its geometry must come from
        # that layer's tokens — a hand-authored radius bypasses them silently.
        # Scoped to src/; dist/ and release/ are output.
        run: npm run lint:primitives

      - name: Test
        # The rules whose failure is invisible in a rendered page: the indexing
        # gate, the cache boundary that keeps a checkout out of a shared cache,
        # the structured-data decision, and the VAT arithmetic that has to match
        # the server's to the cent.
        run: npm run test:run

      - name: Accessibility audit
        # axe-core against the real pages, at WCAG 2.2 AA — the level the
        # accessibility statement claims, so the claim is checked rather than
        # asserted. Runs against the DEV server with a dead API and demo
        # content, not the built one: CI must never read production content to
        # decide whether a PR is mergeable, and the markup under test is the
        # same either way.
        #
        # `channel: chrome` resolves the runner's preinstalled Google Chrome;
        # playwright-core ships no browser binaries on purpose.
        #
        # Note what this does NOT cover: automated checking reaches roughly a
        # third of WCAG. Focus order, link text that means something, and
        # whether refusing a consent is as easy as granting it are read, not
        # measured.
        env:
          PUBLIC_DEMO_MODE: 'true'
          PUBLIC_API_URL: 'http://127.0.0.1:9'
        run: |
          npx astro dev --port 4361 &
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://localhost:4361/; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:4361/ || {
            echo "::error title=Dev server never came up::the accessibility audit had nothing to audit"
            exit 1
          }
          npm run audit:a11y -- http://localhost:4361 / /en/ /rechtliches/impressum

      - name: Configure demo mode
        if: ${{ inputs.publish_branch != '' }}
        run: echo "PUBLIC_DEMO_MODE=${{ inputs.demo_mode }}" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Stamp build
        if: ${{ inputs.publish_branch != '' }}
        run: |
          mkdir -p release/client
          {
            # The only place the deployed version is observable. The site renders
            # it nowhere — no footer line, no meta tag — so without this a
            # release cannot be told apart from the one before it.
            echo "version=$(node -p "require('./package.json').version")"
            echo "channel=${{ inputs.publish_branch }}"
            echo "commit=${GITHUB_SHA}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_run=${GITHUB_RUN_ID}"
          } > release/client/.build-info

      - name: Publish release tree to ${{ inputs.publish_branch }} branch
        if: ${{ inputs.publish_branch != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.PACKAGE_TOKEN }}
          # `release/`, not `dist/`: this site is server-rendered now, so the
          # host needs the SSR bundle, the Passenger startup file and a
          # prebuilt node_modules alongside the document root. The tree is
          # assembled by scripts/pack-release.mjs, which runs as postbuild and
          # refuses to produce one that could not start on the host.
          publish_dir: ./release
          publish_branch: ${{ inputs.publish_branch }}
          commit_message: '${{ inputs.publish_branch }} ${{ github.sha }}'
          force_orphan: true

      - name: Trigger deploy webhook
        if: ${{ inputs.deploy }}
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "DEPLOY_WEBHOOK_URL not set - skipping deploy ping."
            exit 0
          fi
          echo "POSTing deploy webhook to $(printf '%s' "$DEPLOY_WEBHOOK_URL" | cut -d/ -f1-3) ..."
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST -L --post301 --post302 --post303 \
            --retry 3 --retry-delay 5 --max-time 30 \
            "$DEPLOY_WEBHOOK_URL" || echo "000")
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Deploy webhook pinged (HTTP $code)."
          else
            echo "::warning title=Deploy webhook failed::Webhook returned HTTP $code. The release branch is published but the host was not notified - check DEPLOY_WEBHOOK_URL."
          fi
